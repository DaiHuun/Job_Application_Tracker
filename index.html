<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <!-- Header with application counts -->
      <h1>Job Application Tracker</h1>
      <span id="total-count">0 Applications</span>
      <span id="applied-count">0 Applied</span>
      <span id="interviewed-count">0 Interviewed</span>
      <span id="offered-count">0 Offered</span>
      <span id="rejected-count">0 Rejected</span>
    </header>

    <!-- Nav bar for Cleaner UI-->
    <nav id="nav-bar">
      <a href="#add" class="nav-link active" data-page="add">Add Application</a>
      <a href="#applications" class="nav-link" data-page="applications"
        >Applications</a
      >
      <a href="#contact" class="nav-link" data-page="contact">Contact</a>
    </nav>
    <!-- Page 1: Adding an application -->
    <section id="page-add" class="page">
      <!-- ADD APPLICATION FORM -->
      <form id="add-app-form" class="add-app-bar">
        <input
          type="text"
          id="company-name-input"
          placeholder="Name of Company"
          required
        />
        <input
          type="text"
          id="job-title-input"
          placeholder="Job Title"
          required
        />
        <select id="job-status-input">
          <option value="applied">Applied</option>
          <option value="interviewed">Interviewed</option>
          <option value="offered">Offered</option>
          <option value="rejected">Rejected</option>
        </select>
        <input type="date" id="date-applied-input" required />
        <textarea id="note-input" placeholder="Notes"></textarea>
        <button id="add-job-btn">Add Job</button>
      </form>
    </section>

    <!-- Page 2: All Applications -->
    <section id="page-applications" class="page hidden">
      <div id="filter-bar">
        <!-- Filter Buttons -->
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="applied">Applied</button>
        <button class="filter-btn" data-filter="interviewed">
          Interviewed
        </button>
        <button class="filter-btn" data-filter="offered">Offered</button>
        <button class="filter-btn" data-filter="rejected">Rejected</button>
        <!-- Search Bar -->
        <input
          type="search"
          id="search-bar"
          placeholder="Search by Company Name"
        />
      </div>
      <main class="board">
        <!-- Columns for List of Applications -->
        <div id="col-applied">
          <h2 class="column-title">Applied</h2>
          <ul id="list-applied" class="application-list"></ul>
        </div>
        <div id="col-interviewed">
          <h2 class="column-title">Interviewed</h2>
          <ul id="list-interviewed" class="application-list"></ul>
        </div>
        <div id="col-offered">
          <h2 class="column-title">Offered</h2>
          <ul id="list-offered" class="application-list"></ul>
        </div>
        <div id="col-rejected">
          <h2 class="column-title">Rejected</h2>
          <ul id="list-rejected" class="application-list"></ul>
        </div>
      </main>
    </section>

    <!-- Page 3: Contact Form -->
    <section id="page-contact" class="page hidden">
      <form id="contact-form">
        <h2>Contact Me</h2>
        <input type="text" id="contact-name" placeholder="Name..." required />
        <input
          type="email"
          id="contact-email"
          placeholder="Email..."
          required
        />
        <textarea
          id="contact-message"
          placeholder="Reason for Contact..."
          required
        ></textarea>
        <button id="submit-contact-info">SUBMIT</button>
        <p id="contact-feedback"></p>
      </form>
    </section>

    <!-- Script at the bottom so page loads above first -->
    <script src="app.js"></script>
  </body>
</html>
